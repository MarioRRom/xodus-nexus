name: Accept checked translation suggestions

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Preview, accept, or accept and mark technically checked translations Reviewed'
        type: choice
        options: [preview, accept, accept-and-review]
        default: preview
      languages:
        description: 'Optional comma-separated target language tags, e.g. fr,es. Empty selects all targets.'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  # Share the lock with English source sync, not just other acceptance jobs.
  group: tolgee-english
  cancel-in-progress: false

jobs:
  suggestions:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check acceptance tooling without credentials
        run: node --test scripts/ci/tolgee-accept.test.mjs
      - name: Process suggestions
        env:
          TOLGEE_REVIEW_API_KEY: ${{ secrets.TOLGEE_REVIEW_API_KEY }}
          REVIEW_MODE: ${{ inputs.mode }}
          REVIEW_LANGUAGES: ${{ inputs.languages }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          case "$REVIEW_MODE" in
            preview) ;;
            accept) args+=(--apply) ;;
            accept-and-review) args+=(--apply --reviewed) ;;
            *) echo 'Invalid mode' >&2; exit 1 ;;
          esac
          if [ -n "$REVIEW_LANGUAGES" ]; then args+=(--languages "$REVIEW_LANGUAGES"); fi
          node scripts/tolgee-accept.mjs "${args[@]}" | tee tolgee-suggestion-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tolgee-suggestion-report
          path: tolgee-suggestion-report.json
          if-no-files-found: ignore
          retention-days: 14
